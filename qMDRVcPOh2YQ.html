<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pregunta 5 · 25 pedacitos de nosotros</title><style>
:root{--bg:#fffaf5;--ink:#302b2b;--muted:#746c6c;--card:#fff;--accent:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff 0,#fffaf5 45%,#f6eee8 100%);color:var(--ink);font-family:Georgia,serif;min-height:100vh}main{width:min(760px,92%);margin:auto;padding:34px 0 70px}.hero{text-align:center;padding:48px 18px 28px}.jar{font-size:64px;filter:drop-shadow(0 8px 8px #0001)}h1{font-size:clamp(2rem,7vw,4rem);margin:10px 0}.subtitle{font-size:1.08rem;line-height:1.7;color:var(--muted);max-width:620px;margin:0 auto}.card{background:var(--card);border-radius:26px;padding:28px;box-shadow:0 12px 35px #00000012;margin-top:22px}.welcome{text-align:center}.note{color:var(--muted);font-size:.98rem;line-height:1.7}.secret{margin-top:22px;padding:18px;border-radius:18px;background:#fff8f0;font-size:1.05rem}.number{color:var(--accent);font-weight:bold;letter-spacing:.08em}.question{font-size:1.35rem;line-height:1.5;margin:16px 0}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:13px;font:inherit;margin:8px 0 12px}.action{font:inherit;border:0;border-radius:18px;padding:16px;cursor:pointer;background:var(--accent);color:white;width:100%;transition:.2s}.action:hover{transform:translateY(-2px)}.msg{margin-top:15px;line-height:1.7}.success{padding:18px;border-radius:16px;background:#f4f0ff}.back{display:inline-block;margin-top:14px;color:#746c6c;text-decoration:none}.yellow{--accent:#d49a1e}.green{--accent:#5a9b72}.blue{--accent:#4788c7}.red{--accent:#d94a5f}.white{--accent:#777}footer{text-align:center;color:#8b8282;margin-top:30px;font-size:.9rem}</style></head><body><main><section class="hero"><div class="jar">🫙</div><h1>25 pedacitos de nosotros</h1><p class="subtitle">Una pequeña llave solo para ti. 🤎</p></section><section class="card yellow"><div class="number">5/25</div><h2>La prenda prohibida</h2><div class="question">🔐 ¿Prenda tuya que odio?</div><input id="answer" placeholder="Escribe tu respuesta..." autocomplete="off"><button class="action" onclick="check()">DESBLOQUEAR</button><div id="result"></div><a class="back" href="../">← Volver al inicio</a></section><footer>Hecho para guardar un poquito de nosotros incluso a kilómetros de distancia. ❤️</footer></main><script>function normalize(s){return s.toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}function check(){const value=normalize(document.getElementById('answer').value),result=document.getElementById('result');if(value===normalize('polar')){result.innerHTML=`<div class="success msg">Mi amor quiero verte siendo la niña más feliz de este mundo, porque tu felicidad es la mía. Sonríe, que cuando lo haces mi vida es mucho más bonita 🤎</div>`}else{result.innerHTML='<p class="msg">💭 Esa no es la respuesta… prueba otra vez.</p>'}}document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});</script></body></html>
